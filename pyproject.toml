[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qma-face"
version = "0.14.0"
description = "A local, guided face-analysis desktop application."
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.11.2", "Pillow==12.3.0", "numpy>=2,<3", "onnxruntime==1.30.0"]

[project.optional-dependencies]
research = ["torch==2.13.0", "torchvision==0.28.0", "Pillow==12.3.0", "numpy>=2,<3"]
library = ["pypdf>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6,<7", "onnx>=1.17,<2"]

[project.scripts]
qma-face = "qma_face.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
